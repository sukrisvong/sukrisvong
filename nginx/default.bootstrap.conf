# Temporary HTTP-only config used during initial SSL certificate issuance.
# Replace with default.prod.conf after certs are obtained.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Bootstrapping SSL...';
        add_header Content-Type text/plain;
    }
}
