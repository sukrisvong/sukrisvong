name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to droplet via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app
            git pull origin main
            docker compose --env-file /app/.env -f docker-compose.yml -f docker-compose.prod.yml build
            docker compose --env-file /app/.env -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker compose --env-file /app/.env -f docker-compose.yml -f docker-compose.prod.yml exec backend bundle exec rails db:migrate
            docker image prune -f
